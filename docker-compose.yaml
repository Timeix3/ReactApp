

services:
  # ==========================================
  # 1. База данных PostgreSQL
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: app_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Backend (FastAPI + SQLModel)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # Ждем, пока БД реально запустится
    env_file:
      - ./backend/.env
    volumes:
      # Монтируем только папку с кодом для hot-reload, 
      # чтобы не перетирать установленные зависимости и alembic
      - ./backend/app:/app/app 
      - ./backend/alembic:/app/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local